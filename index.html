<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chicken Hunt">
<title>Shoreditch Chicken Hunt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%94%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: phone-first night map — sticky clock header, one working pane, bottom tab bar */
:root{
  --night:#12131a;--panel:#1c1e29;--panel-2:#262938;--line:#353a50;
  --ink:#f1efe8;--mute:#a19fae;--yolk:#ffc23d;--yolk-ink:#2a1d00;--comb:#ff5d4f;--ok:#5fd38d;
  --t1:#4fd1c5;--t2:#b68cff;--t3:#ff8a3d;
  --f-display:"Bagel Fat One","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:1100;background:var(--night)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--yolk);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:1000;background:var(--night);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:20px;line-height:1;color:var(--yolk)}
.brand small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.clock{margin-left:auto;text-align:right}
.clock .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.clock .val{font-family:var(--f-mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.clock .sub{font-family:var(--f-mono);font-size:12px;color:var(--yolk);font-variant-numeric:tabular-nums}
.strip{background:var(--panel);border-bottom:1px solid var(--line)}
.strip .wrap{display:flex;gap:8px;align-items:center;padding-block:8px;font-size:13px;font-weight:600;flex-wrap:wrap}
.eggs{display:flex;gap:4px;margin-left:auto}
.egg{width:14px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:2px solid var(--yolk);opacity:.5}
.egg.on{background:var(--yolk);opacity:1}
.live{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.live.on{background:var(--ok)}
main{padding-block:16px 110px}
main.wrap{display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:flex;gap:4px;padding-block:6px}
nav.tabs button{flex:1;min-width:0;background:none;border:0;border-radius:10px;padding:8px 2px;font-size:12px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--yolk);background:var(--panel-2)}
nav.tabs .dot{position:absolute;top:5px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--comb)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1}
h3{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
p{margin:0}
.muted{color:var(--mute)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.section{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow,.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--yolk);color:var(--yolk-ink);border-color:var(--yolk)}
.btn.danger{background:transparent;color:var(--comb);border-color:var(--comb)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--yolk);color:var(--yolk-ink);border-color:var(--yolk)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--panel-2);color:var(--mute);white-space:nowrap}
.tag.yolk{background:var(--yolk);color:var(--yolk-ink)}
.tag.ok{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.tag.bad{background:color-mix(in srgb,var(--comb) 22%,transparent);color:var(--comb)}
.tdot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--mute);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=tel],select,textarea{background:var(--night);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.switch{display:flex;gap:12px;align-items:center;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--yolk)}

/* map */
.mapbox{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#191a22}
#lmap{width:100%;height:min(62vh,560px);background:#191a22}
.mapbtns{position:absolute;right:10px;bottom:28px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mapbtns button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:17px;font-weight:800;display:grid;place-items:center}
.maplegend{position:absolute;left:10px;top:10px;z-index:500;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;font-weight:700;color:var(--mute);background:color-mix(in srgb,var(--panel) 90%,transparent);padding:6px 10px;border-radius:999px;max-width:calc(100% - 70px)}
.maplegend span{display:inline-flex;align-items:center;gap:5px}
.maphint{position:absolute;left:10px;right:60px;top:44px;z-index:500;font-size:12px;font-weight:700;background:var(--yolk);color:var(--yolk-ink);padding:6px 10px;border-radius:999px;width:max-content;max-width:calc(100% - 70px)}
.leaflet-container{font-family:var(--f-body)}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--panel);color:var(--ink);border-color:var(--line)}
.leaflet-control-attribution{background:rgba(18,19,26,.8)!important;color:var(--mute)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--mute)!important}
.leaflet-tooltip{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:600;box-shadow:none}
.leaflet-tooltip-top:before{border-top-color:var(--line)}
.pdot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#111;border:2px solid #12131a;box-shadow:0 0 0 2px currentColor}
.pdot.old{opacity:.45}
.medot{width:18px;height:18px;border-radius:50%;background:#4ea3ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(78,163,255,.25)}
.hen{font-size:24px;line-height:1;filter:drop-shadow(0 0 4px #000)}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .name{font-weight:700;overflow-wrap:anywhere}
.item .meta{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.item.done .name{text-decoration:line-through;color:var(--mute)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#111;flex:none}
.feed{display:flex;flex-direction:column;gap:10px}
.post{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.post.hint{border-color:color-mix(in srgb,var(--yolk) 55%,var(--line))}
.post.alert{border-color:color-mix(in srgb,var(--comb) 60%,var(--line))}
.post .head{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;color:var(--mute);flex-wrap:wrap}
.post .body{font-size:16px;overflow-wrap:anywhere;white-space:pre-wrap}
.photo{width:100%;border-radius:10px;background:var(--panel-2);cursor:zoom-in;border:0;padding:0;display:block}
.photo img{width:100%;max-height:340px;object-fit:cover;border-radius:10px;display:block}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,120px) 1fr 34px;gap:10px;align-items:center;font-size:14px;font-weight:600}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{height:12px;background:var(--panel-2);border-radius:6px;overflow:hidden}
.bar .fill{display:block;height:100%;border-radius:6px}
.bar .n{font-family:var(--f-mono);text-align:right}
.hero{display:flex;flex-direction:column;gap:12px;padding-block:8px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,11vw,56px);line-height:.95;color:var(--yolk)}
.hero h1 span{color:var(--ink)}
.banner{border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;font-weight:600;flex-wrap:wrap}
.banner.yolk{background:var(--yolk);color:var(--yolk-ink)}
.banner.info{background:var(--panel-2)}
.banner.bad{background:color-mix(in srgb,var(--comb) 20%,var(--panel));border:1px solid var(--comb)}
.big{font-family:var(--f-mono);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.teampick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.teampick button{border:2px solid var(--line);background:var(--panel-2);border-radius:var(--r);padding:12px 8px;font-weight:800;display:flex;align-items:center;gap:8px;font-size:14px;min-width:0;overflow-wrap:anywhere;text-align:left}
.teampick button[aria-pressed="true"]{border-color:var(--yolk);background:var(--panel)}
.award{display:flex;gap:12px;align-items:flex-start}
.award .ico{font-size:28px;line-height:1;flex:none;width:36px;text-align:center}
.award .t{font-weight:800}
.power{display:flex;gap:12px;align-items:center}
.power .ico{font-size:24px;width:40px;height:40px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;flex:none}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1200}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1201;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{display:flex;flex-direction:column;gap:14px;padding-block:14px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.x{margin-left:auto;background:var(--panel-2);border:0;border-radius:50%;width:34px;height:34px;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:1300;background:var(--ink);color:var(--night);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--mute);font-size:14px}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
details summary{cursor:pointer}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">Chicken Hunt<small>Shoreditch · Fri 6 Nov</small></div>
  <div class="clock" id="clock"><div class="lbl">Loading</div><div class="val">--:--</div></div>
</div></header>
<div class="strip" id="strip" hidden></div>
<main class="wrap" id="main"><div class="empty">Opening the game…</div></main>
<nav class="tabs" id="tabs" hidden></nav>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script src="config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script>
/* ================= constants ================= */
const POWERS={
  hint:{i:"💡",n:"Bonus clue",d:"The chickens send your team a private clue."},
  question:{i:"❓",n:"Yes/No question",d:"Ask the chickens one yes/no question."},
  compass:{i:"🧭",n:"Compass",d:"The chickens tell you which direction to walk."},
  peek:{i:"🔭",n:"Zone peek",d:"See the next, smaller zone straight away."},
  sabotage:{i:"🍺",n:"Sabotage",d:"Pick a rival team. One of them has to drink."}
};
const DRINKS=["Pint","Half","Shot","Wine","Cocktail","Cider"];
const REASONS=["Wrong bar","Sabotaged","Penalty from the chickens","Just thirsty"];
const SEEKERS=["t1","t2","t3"];
const RADII=[750,480,280,140];
const DIRS=["N","NE","E","SE","S","SW","W","NW"];
const CENTER={lat:51.5245,lng:-0.0790};

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const ms=v=>typeof v==="number"?v:Date.parse(v);
const LDN={timeZone:"Europe/London"};
const fmtT=v=>new Intl.DateTimeFormat("en-GB",{...LDN,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date(ms(v)));
const fmtD=v=>new Intl.DateTimeFormat("en-GB",{...LDN,weekday:"short",day:"numeric",month:"short"}).format(new Date(ms(v)));
function hms(x){x=Math.max(0,x);const s=Math.floor(x/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),z=s%60;const p=n=>String(n).padStart(2,"0");return h?`${h}:${p(m)}:${p(z)}`:`${p(m)}:${p(z)}`}
function ago(v){const m=Math.round((Date.now()-ms(v))/60000);return m<1?"just now":m<60?m+" min ago":Math.floor(m/60)+"h "+(m%60)+"m ago"}
function tzOff(t){const p=Object.fromEntries(new Intl.DateTimeFormat("en-GB",{...LDN,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date(t)).map(x=>[x.type,x.value]));return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)-t}
function londonToMs(ds,ts){const[y,m,d]=ds.split("-").map(Number),[h,mi]=ts.split(":").map(Number);const g=Date.UTC(y,m-1,d,h,mi);return g-tzOff(g)}
function londonParts(t){const p=Object.fromEntries(new Intl.DateTimeFormat("en-GB",{...LDN,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(new Date(t)).map(x=>[x.type,x.value]));return{date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}`}}
const KX=111320*Math.cos(CENTER.lat*Math.PI/180),KY=110574;
const P=(lng,lat)=>[(lng-CENTER.lng)*KX,(CENTER.lat-lat)*KY];
const UNP=(x,y)=>({lng:x/KX+CENTER.lng,lat:CENTER.lat-y/KY});
const dist=(a,b)=>{const p=P(a.lng,a.lat),q=P(b.lng,b.lat);return Math.hypot(p[0]-q[0],p[1]-q[1])};
function bearing(a,b){const p=P(a.lng,a.lat),q=P(b.lng,b.lat);const ang=(Math.atan2(q[0]-p[0],p[1]-q[1])*180/Math.PI+360)%360;return DIRS[Math.round(ang/45)%8]}
function toast(msg){const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",3400)}
const norm=s=>String(s||"").toLowerCase().replace(/^the\s+/,"").replace(/[^a-z0-9]/g,"");

/* ================= setup check ================= */
const CFG=window.CHICKEN_CONFIG||{};
const CONFIGURED=!!(CFG.supabaseUrl&&CFG.supabaseKey&&!/YOUR-/.test(CFG.supabaseUrl+CFG.supabaseKey));
const sb=CONFIGURED&&window.supabase?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey):null;

/* ================= state ================= */
const S={cfg:null,teams:{},venues:[],players:{},drinks:[],clues:[],claims:{},reqs:[],found:{},hints:[],visits:[],gm:null,
  loaded:false,live:false,tab:null,showAll:false,pickMode:false,pick:null,draft:null,joinTeam:null,joinName:null,dr:null,osm:null,resetArm:false,pinBad:false,
  gps:{on:ls.get("ch_gps")==="1",watch:null,pos:null,sent:null,err:null,wake:ls.get("ch_wake")==="1",lock:null}};
try{S.id=JSON.parse(ls.get("ch_id")||"null")}catch(e){S.id=null}
const saveId=()=>ls.set("ch_id",S.id?JSON.stringify(S.id):null);

const myTeam=()=>S.id?.team||null;
const isGM=()=>myTeam()==="h";
const team=t=>S.teams[t]||{name:t,color:"#888",members:[]};
const tName=t=>team(t).name;
const tCol=t=>team(t).color;
const venues=()=>S.venues.filter(v=>!v.hidden);
const venue=id=>S.venues.find(v=>v.id===id);
const zones=()=>S.cfg?.zones||[];
const powerBars=()=>(S.cfg?.power_bars||[]).filter(p=>p.venue);
const powerAt=id=>powerBars().find(p=>p.venue===id);
const mineVisited=()=>new Set(S.visits.map(v=>v.venue));

function T(){
  const c=S.cfg;if(!c||!c.start_at)return{phase:"setup",zi:0,n:4};
  const st=ms(c.start_at),dur=(c.duration_min||120)*60000,now=Date.now();
  const nf=SEEKERS.filter(t=>S.found[t]).length;
  const n=zones().length||4,w=dur/n,el=now-st;
  const phase=now<st?"pre":(c.ended||now>=st+dur||nf>=3)?"over":"live";
  const zi=Math.max(0,Math.min(n-1,Math.floor(el/w)));
  return{phase,st,dur,now,el,zi,w,n,next:st+(zi+1)*w,end:st+dur};
}
const zoneAt=t=>{const x=T();if(!x.st)return 0;return Math.max(0,Math.min(x.n-1,Math.floor((ms(t)-x.st)/x.w)))};
const peekActive=()=>Object.values(S.claims).some(c=>c.team===myTeam()&&c.power==="peek"&&c.used&&zoneAt(c.used_at)===T().zi);

/* ================= data ================= */
const TABLES=["config","teams","venues","players","drinks","clues","claims","requests","found"];
async function load(t){
  let q=sb.from(t).select("*");
  if(t==="drinks")q=q.order("ts",{ascending:false}).limit(1000);
  if(t==="teams")q=q.order("sort");

  else if(peekActive())top=`<div class="banner yolk"><span style="font-size:22px">🔭</span><span class="grow">Zone peek is on. The dashed circle is the next zone.</span></div>`;
  const zz=z[t.zi];const vs=venues().filter(v=>S.showAll||inZone(v));
  if(zz)vs.sort((a,b)=>dist(a,zz)-dist(b,zz));
  if(S.gps.pos)vs.sort((a,b)=>dist(a,S.gps.pos)-dist(b,S.gps.pos));
  const done=mineVisited();const left=vs.filter(v=>!done.has(v.id)).length;
  return `${top}${gpsCard()}${mapSlot()}
  <div class="row"><h3 class="grow">${S.showAll?"All bars":"Bars in the zone"} · ${left} to check${S.gps.pos?" · nearest first":""}</h3><button class="btn sm ghost" data-act="toggleAll">${S.showAll?"Only the zone":"Show all"}</button></div>
  <div class="list">${vs.map(v=>venueRow(v,done.has(v.id))).join("")||`<div class="item"><span class="muted">No bars in this zone.</span></div>`}</div>`;
}
function venueRow(v,done){
  const pw=powerAt(v.id),cl=S.claims[v.id];const d=S.gps.pos?` · ${Math.round(dist(v,S.gps.pos))} m`:"";

}
const gmaps=v=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(v.name+", "+(v.address||"")+", London");
function openVenue(id){

async function markChecked(id){

}
async function claimPower(id){

/* ================= drinks ================= */
function teamMembers(tm){
  const fromPlayers=Object.values(S.players).filter(p=>p.team===tm);
  return fromPlayers.sort((a,b)=>a.name.localeCompare(b.name));
}
function openDrink(pre={}){
  const tm=myTeam(),members=teamMembers(tm);
  const sel=new Set(pre.all?members.map(p=>p.id):[S.id.player]);
  S.dr={sel,drink:"Pint"};
  openSheet(`<div class="row"><h2 class="grow">Log a drink</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="section"><h3>Who drank</h3><div class="chips">${members.map(p=>`<button class="chip" data-who="${p.id}" aria-pressed="${sel.has(p.id)}">${esc(p.name)}</button>`).join("")}</div>
  ${members.length<team(tm).members.length?`<p class="muted small">Teammates show up here once they've joined on their own phone.</p>`:""}</div>
  <div class="section"><h3>What</h3><div class="chips">${DRINKS.map(d=>`<button class="chip" data-what="${d}" aria-pressed="${d==="Pint"}">${d}</button>`).join("")}</div><p class="muted small">Soft drinks are not on the list. That's the rule.</p></div>
  <label class="fld" for="drWhy">Why<select id="drWhy">${REASONS.map(r=>`<option ${r===(pre.reason||(tm==="h"?"Just thirsty":"Wrong bar"))?"selected":""}>${r}</option>`).join("")}</select></label>
  <label class="fld" for="drPhoto">Photo proof<input type="file" id="drPhoto" accept="image/*"></label>
  <button class="btn primary block" data-act="saveDrink" id="drSave">Log it</button>`);
}
async function saveDrink(){
  const d=S.dr;if(!d||!d.sel.size)return toast("Pick who drank.");
  const btn=$("#drSave");btn.disabled=true;btn.textContent="Saving…";
  let photo="";try{photo=await uploadPhoto($("#drPhoto")?.files?.[0])}catch(e){console.error(e);toast("The photo didn't upload. Logging without it.")}
  const reason=$("#drWhy").value;
  const items=[...d.sel].map(id=>({player:id,name:S.players[id]?.name||S.id.name,drink:d.drink,reason,photo}));
  const r=await rpc("log_drinks",{...auth(),p_by:S.id.player,p_items:items});
  if(r.error){btn.disabled=false;btn.textContent="Log it";return}
  closeSheet();toast(items.length>1?`${items.length} drinks logged. Cheers.`:"Drink logged. Cheers.");load("drinks");
}
function viewDrinks(){
  const gm=isGM(),tm=myTeam(),order=["t1","t2","t3","h"];
  const byTeam={};order.forEach(t=>byTeam[t]=0);S.drinks.forEach(d=>byTeam[d.team]=(byTeam[d.team]||0)+1);
  const max=Math.max(1,...Object.values(byTeam));
  const byP={};S.drinks.forEach(d=>{const k=d.player||d.name;byP[k]=byP[k]||{name:d.name,team:d.team,n:0};byP[k].n++});
  const top=Object.values(byP).sort((a,b)=>b.n-a.n).slice(0,5);
  return `<button class="btn primary block" data-act="drink">Log a drink</button>
  <div class="card"><h3>Drinks per team</h3><div class="bars">${order.map(t=>`<div class="bar"><span class="lbl">${esc(tName(t))}</span><span class="trk"><span class="fill" style="width:${byTeam[t]/max*100}%;background:${tCol(t)}"></span></span><span class="n">${byTeam[t]}</span></div>`).join("")}</div></div>
  ${top.length?`<div class="card"><h3>Thirstiest people</h3>${top.map((p,i)=>`<div class="row"><span class="mono muted">${i+1}</span><span class="avatar" style="background:${tCol(p.team)}">${esc((p.name||"?")[0])}</span><div class="grow"><b>${esc(p.name)}</b><div class="muted small">${esc(tName(p.team))}</div></div><span class="mono" style="font-size:18px;font-weight:700">${p.n}</span></div>`).join("")}</div>`:""}
  <h3>Drink log</h3>
  <div class="feed">${S.drinks.length?S.drinks.map(d=>`<article class="post"><div class="head"><span class="avatar" style="background:${tCol(d.team)};width:26px;height:26px;font-size:12px">${esc((d.name||"?")[0])}</span><span style="color:var(--ink)">${esc(d.name)}</span><span>${esc(tName(d.team))}</span><span>· ${fmtT(d.ts)}</span>${S.cfg?.best_photo===d.id?`<span class="tag yolk">Best photo</span>`:""}</div>
    <div class="body"><b>${esc(d.drink)}</b> · ${esc(d.reason)}</div>${photoBtn(d.photo)}
    <div class="row">${gm&&d.photo?`<button class="btn sm ghost" data-act="best" data-id="${d.id}">${S.cfg?.best_photo===d.id?"Best photo ✓":"Pick as best photo"}</button>`:""}${d.team===tm||gm?`<button class="btn sm ghost" data-act="delDrink" data-id="${d.id}">Remove</button>`:""}</div></article>`).join(""):`<div class="empty">No drinks yet. The first wrong bar will show up here.</div>`}</div>`;
}

/* ================= seeker: clues ================= */
function myFeed(){
  const tm=myTeam(),items=[];
  (S.hints||[]).forEach((h,i)=>items.push({ts:ms(h.at),kind:"hint",html:`<div class="head"><span class="tag yolk">Hint ${i+1}</span><span>${fmtT(h.at)}</span></div><div class="body">${esc(h.text)}</div>`}));
  S.clues.filter(c=>c.to_team==="all"||c.to_team===tm).forEach(c=>items.push({ts:ms(c.ts),kind:c.to_team==="all"?"":"hint",html:`<div class="head"><span class="tag">${c.to_team==="all"?"From the chickens":"Just for your team"}</span><span>${fmtT(c.ts)}</span></div>${c.text?`<div class="body">${esc(c.text)}</div>`:""}${photoBtn(c.photo)}`}));
  S.reqs.filter(r=>r.team===tm&&r.power!=="sabotage").forEach(r=>items.push({ts:ms(r.answered_at||r.ts),kind:"hint",html:`<div class="head"><span class="tag yolk">${POWERS[r.power]?.i||""} ${POWERS[r.power]?.n||r.power}</span><span>${fmtT(r.ts)}</span></div>${r.text?`<div class="body muted">You asked: ${esc(r.text)}</div>`:""}<div class="body">${r.answer?esc(r.answer):`<span class="muted">Waiting for the chickens to answer…</span>`}</div>`}));
  S.reqs.filter(r=>r.power==="sabotage"&&r.target===tm).forEach(r=>items.push({ts:ms(r.ts),kind:"alert",html:`<div class="head"><span class="tag bad">🍺 Sabotage</span><span>${fmtT(r.ts)}</span></div><div class="body">${esc(tName(r.team))} sabotaged you. One of you drinks now.</div><button class="btn sm" style="align-self:flex-start" data-act="drink" data-reason="Sabotaged">Log the drink</button>`}));
  S.reqs.filter(r=>r.power==="sabotage"&&r.team===tm).forEach(r=>items.push({ts:ms(r.ts),kind:"",html:`<div class="head"><span class="tag">🍺 Sabotage sent</span><span>${fmtT(r.ts)}</span></div><div class="body">${esc(tName(r.target))} has to drink.</div>`}));
  return items.sort((a,b)=>b.ts-a.ts);
}
function newClues(){const f=myFeed();return f.length&&f[0].ts>+(ls.get("ch_seen")||0)&&S.tab!=="clues"}
function viewClues(){

  <div class="feed">${f.length?f.map(i=>`<article class="post ${i.kind}">${i.html}</article>`).join(""):`<div class="empty">${t.phase==="pre"||t.phase==="setup"?"Hints unlock during the hunt.":"No clues yet. The chickens will send some."}</div>`}</div>`;

function openUse(vid){

async function doUse(vid){
  const c=S.claims[vid];if(!c||c.used)return;let text="",target="";
  if(c.power==="question"){text=($("#useText")?.value||"").trim();if(!text)return toast("Type your question.")}
  if(c.power==="sabotage"){target=document.querySelector("[data-target][aria-pressed=true]")?.dataset.target;if(!target)return toast("Pick a team.")}
  const lastV=S.visits.slice().sort((a,b)=>ms(b.ts)-ms(a.ts))[0];

  if(r.error)return;closeSheet();
  toast(c.power==="peek"?"Next zone revealed on the map.":c.power==="sabotage"?"Sabotage sent.":"Sent. The answer will appear in Clues.");

}

    <div class="row">${f?`<button class="btn sm ghost" data-act="unfound" data-id="${tm}">Undo found</button>`:`<button class="btn sm primary" data-act="found" data-id="${tm}">They found us</button>`}</div></div>`}).join("")}</div>`;

function reqCard(r,locs,hide){
  const pw=POWERS[r.power]||{i:"",n:r.power};let ui="",extra="";
  if(r.power==="compass"){
    const l=locs.filter(x=>x.team===r.team).sort((a,b)=>ms(b.ts)-ms(a.ts))[0];
    if(l&&hide)extra=` Suggested: <b>${bearing(l,hide)}</b> (from ${esc(l.name)}'s live spot).`;
    ui=`<div class="chips">${DIRS.map(d=>`<button class="chip" data-act="answer" data-id="${r.id}" data-a="Walk ${d}">${d}</button>`).join("")}</div>`;
  }else if(r.power==="question")ui=`<div class="chips">${["Yes","No","Can't say"].map(a=>`<button class="chip" data-act="answer" data-id="${r.id}" data-a="${a}">${a}</button>`).join("")}</div>`;
  else if(r.power==="hint")ui=`<button class="btn sm primary" style="align-self:flex-start" data-act="clueSheet" data-id="${r.id}" data-team="${r.team}">Write the clue</button>`;
  else ui=`<button class="btn sm" style="align-self:flex-start" data-act="dismiss" data-id="${r.id}">Got it</button>`;
  return `<div class="post ${r.power==="sabotage"?"alert":"hint"}"><div class="head"><span class="tag yolk">${pw.i} ${pw.n}</span><span class="tdot" style="background:${tCol(r.team)}"></span><span>${esc(tName(r.team))} · ${fmtT(r.ts)}</span></div>
  <div class="body">${r.power==="sabotage"?`They sabotaged ${esc(tName(r.target))}.`:r.text?esc(r.text):r.power==="compass"?`Which way should they walk?${r.spot?" Last bar: "+esc(r.spot)+".":""}${extra}`:"They want a bonus clue."}</div>${ui}</div>`;
}

function readDraft(){
  const d=S.draft;if(!d||!$("#suDate"))return;
  const val=(id,f)=>{const el=document.getElementById(id);return el?el.value:f};
  d.date=val("suDate",d.date)||d.date;d.time=val("suTime",d.time)||d.time;d.dur=+val("suDur",d.dur)||120;d.meet=val("suMeet",d.meet);d.hideout=val("suHide",d.hideout);
  d.teams.forEach((tm,i)=>{tm.name=val("suTn"+i,tm.name);tm.members=val("suTm"+i,tm.members);tm.pin=String(val("suTp"+i,tm.pin)).trim()});
  d.hints=d.hints.map((h,i)=>({min:Math.max(0,+val("suHm"+i,h.min)||0),text:String(val("suHt"+i,h.text)).trim()}));
  d.powerBars=d.powerBars.map((p,i)=>({power:p.power,venue:val("suP"+i,p.venue)}));
}
document.addEventListener("input",e=>{if(S.tab==="setup"&&$("#main").contains(e.target))readDraft()});
function genZones(h){
  const hp=P(h.lng,h.lat),n=RADII.length,c=[];const rnd=(a,b)=>a+Math.random()*(b-a),ang=()=>Math.random()*Math.PI*2;
  let a=ang(),dd=RADII[n-1]*rnd(.35,.7);c[n-1]=[hp[0]+Math.cos(a)*dd,hp[1]+Math.sin(a)*dd];
  for(let i=n-2;i>=0;i--){const slack=RADII[i]-RADII[i+1];a=ang();dd=slack*rnd(.35,.85);c[i]=[c[i+1][0]+Math.cos(a)*dd,c[i+1][1]+Math.sin(a)*dd]}
  return c.map((p,i)=>{const q=UNP(p[0],p[1]);return{lat:+q.lat.toFixed(6),lng:+q.lng.toFixed(6),r:RADII[i]}});
}
function randPower(){
  readDraft();const d=S.draft,z=d.zones[0],h=venue(d.hideout);
  let pool=venues().filter(v=>(!z||dist(v,z)<=z.r)&&v.id!==d.hideout&&(!h||dist(v,h)>220));const picked=[];
  d.powerBars.forEach(p=>{pool=pool.filter(v=>picked.every(q=>dist(v,q)>200));const v=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;p.venue=v?v.id:"";if(v)picked.push(v)});
  render();
}

async function osmSearch(){
  readDraft();const z=S.draft.zones[0]||{lat:CENTER.lat,lng:CENTER.lng,r:900};
  S.osm={loading:true};render();
  const q=`[out:json][timeout:25];nwr["amenity"~"^(pub|bar|biergarten)$"](around:${Math.round(z.r+150)},${z.lat},${z.lng});out center tags;`;
  try{
    const res=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(q)});
    if(!res.ok)throw new Error("status "+res.status);
    const j=await res.json();
    const items=j.elements.map(e=>({id:"osm-"+e.type[0]+e.id,name:e.tags?.name,address:[e.tags?.["addr:housenumber"],e.tags?.["addr:street"]].filter(Boolean).join(" "),lat:e.lat??e.center?.lat,lng:e.lon??e.center?.lon,source:"osm"})).filter(x=>x.name&&x.lat);
    const fresh=items.filter(x=>!S.venues.some(v=>v.id===x.id||(norm(v.name)===norm(x.name)&&dist(v,x)<120)));
    S.osm={total:items.length,fresh};
  }catch(e){console.error(e);S.osm={error:"OpenStreetMap didn't answer. Try again in a minute."}}
  render();
}

function viewAwards(){
  const t=T(),fs=SEEKERS.filter(x=>S.found[x]).map(x=>[x,S.found[x]]).sort((a,b)=>ms(a[1].ts)-ms(b[1].ts));
  const st=t.st||0,mins=v=>Math.max(0,Math.round((ms(v)-st)/60000));
  const byP={};S.drinks.forEach(d=>{const k=d.player||d.name;byP[k]=byP[k]||{name:d.name,team:d.team,n:0};byP[k].n++});
  const topP=Object.values(byP).filter(p=>p.team!=="h").sort((a,b)=>b.n-a.n)[0];
  const tc={};SEEKERS.forEach(x=>tc[x]=S.drinks.filter(d=>d.team===x).length);
  const thirsty=SEEKERS.slice().sort((a,b)=>tc[b]-tc[a])[0];
  const visits=S.gm?.visits;const vc={};if(visits)SEEKERS.forEach(x=>vc[x]=visits.filter(v=>v.team===x).length);
  const tour=visits?SEEKERS.slice().sort((a,b)=>vc[b]-vc[a])[0]:null;
  const pc={};SEEKERS.forEach(x=>pc[x]=Object.values(S.claims).filter(c=>c.team===x).length);
  const power=SEEKERS.slice().sort((a,b)=>pc[b]-pc[a])[0];
  const sab=S.reqs.filter(r=>r.power==="sabotage"),chickD=S.drinks.filter(d=>d.team==="h").length,notFound=SEEKERS.filter(x=>!S.found[x]);
  const best=S.drinks.find(d=>d.id===S.cfg?.best_photo)||S.drinks.find(d=>d.photo);
  const A=[];
  if(fs[0])A.push(["🏆","Chicken Catchers",`${tName(fs[0][0])} found the nest after ${mins(fs[0][1].ts)} minutes.`]);
  if(fs.length>1)A.push(["🥈","Runners-up",`${tName(fs[1][0])}, ${mins(fs[1][1].ts)} minutes.`]);
  if(notFound.length&&t.phase==="over")A.push(["🧭","Lost in Shoreditch",`${notFound.map(x=>tName(x)).join(" and ")} never made it. Next round is on them.`]);
  else if(fs.length===3)A.push(["🐢","Last to the nest",`${tName(fs[2][0])} arrived last and buys the round.`]);
  if(topP)A.push(["🍺","Thirstiest player",`${topP.name} (${tName(topP.team)}) with ${topP.n} drinks.`]);
  if(tc[thirsty])A.push(["🍻","Thirstiest team",`${tName(thirsty)} with ${tc[thirsty]} drinks.`]);
  if(tour&&vc[tour])A.push(["🗺️","Grand tour",`${tName(tour)} checked ${vc[tour]} bars.`]);
  if(pc[power])A.push(["🎁","Power players",`${tName(power)} grabbed ${pc[power]} power-up${pc[power]>1?"s":""}.`]);
  if(sab.length)A.push(["😈","Saboteurs",sab.map(s=>`${tName(s.team)} → ${tName(s.target)}`).join(", ")+"."]);
  A.push(["🐔","Meanwhile, at the nest",`The chickens drank ${chickD} while they waited.`]);
  return `<section class="hero"><h1>${t.phase==="over"?"Awards":"Awards <span>so far</span>"}</h1>${t.phase!=="over"?`<p class="muted">Preview for the chickens. Seekers see this once the hunt ends.</p>`:""}</section>
  <div class="card">${A.map(a=>`<div class="award"><span class="ico">${a[0]}</span><div><div class="t">${esc(a[1])}</div><div class="muted">${esc(a[2])}</div></div></div>`).join("<hr class='sep'>")}</div>
  ${best?`<div class="card"><h3>📸 Best photo</h3>${photoBtn(best.photo)}<p class="muted small">${esc(best.name)}, ${esc(best.drink)} · ${esc(best.reason)}</p></div>`:""}`;
}

      if(!r.error){S.pickMode=false;S.pick=null;await load("venues");render()}break}
    case"saveSetup":saveSetup();break;
    case"startNow":{const r=await rpc("gm_patch",{...gmp(),p_patch:{start_at:new Date().toISOString(),ended:false}},"The hunt has started.");if(!r.error&&S.draft){const q=londonParts(Date.now());S.draft.date=q.date;S.draft.time=q.time}load("config");break}
    case"endNow":rpc("gm_patch",{...gmp(),p_patch:{ended:true}},"The hunt is over.");break;
    case"resume":rpc("gm_patch",{...gmp(),p_patch:{ended:false}},"The hunt is back on.");break;
    case"resetArm":S.resetArm=true;render();break;
    case"resetCancel":S.resetArm=false;render();break;
    case"reset":{S.resetArm=false;const r=await rpc("gm_reset",{...gmp(),p_players:a.dataset.p==="1"},"Game data cleared.");if(!r.error){TABLES.forEach(load);loadPrivate()}break}
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="gpsT"){e.target.checked?gpsStart():gpsStop()}
  if(e.target.id==="wakeT"){S.gps.wake=e.target.checked;ls.set("ch_wake",S.gps.wake?"1":null);S.gps.wake?wakeOn():wakeOff()}
  if(S.tab==="setup"&&$("#main").contains(e.target))readDraft();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

render();boot();
</script>
</body>
